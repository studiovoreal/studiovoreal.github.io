<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Admin · Studio Voreal</title> <link rel="stylesheet" href="../assets/css/style.css" /> <style> form{display:grid;gap:14px;max-width:720px} input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#141a33;color:#fff} textarea{min-height:110px;resize:vertical} button{padding:14px 18px;border:none;border-radius:12px;background:#7c5cff;color:#fff;font-weight:600;cursor:pointer} pre{white-space:pre-wrap;background:#141a33;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);overflow:auto} </style> </head> <body> <header> <div class="brand">Studio Voreal · Admin</div> </header> <main class="container"> <h1 class="section-title">Nuevo video</h1> <form id="form"> <input name="categoria" placeholder="Categoría" required /> <input name="subcategoria" placeholder="Subcategoría" required /> <input name="titulo" placeholder="Título del video" required /> <textarea name="descripcion" placeholder="Descripción (opcional)"></textarea> <input name="onedrive" placeholder="Enlace público de OneDrive" required /> <input name="thumbnail" placeholder="Imagen (opcional)" /> <button type="submit">Generar bloque</button> </form> <div style="height:28px"></div> <h2>Resultado</h2> <pre id="output">Aquí aparecerá el bloque listo para copiar.</pre> </main> <script> function slugify(text) { return text .toLowerCase() .normalize("NFD") .replace(/[\u0300-\u036f]/g, "") .replace(/[^a-z0-9]+/g, "-") .replace(/^-+|-+$/g, ""); } document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); const result = { slug: slugify(data.titulo), categoria: data.categoria, subcategoria: data.subcategoria, titulo: data.titulo, descripcion: data.descripcion, onedrive: data.onedrive, thumbnail: data.thumbnail || "assets/img/placeholder.jpg" }; document.getElementById("output").textContent = JSON.stringify(result, null, 2) + ","; }); </script> </body> </html>
