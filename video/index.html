<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Voreal</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
  <header>
    <div class="brand">Studio Voreal</div>
  </header>

  <main class="container" id="video-page">
    <div class="empty">Cargando video…</div>
  </main>

  <script>
    async function loadVideo() {
      const path = location.pathname;
      const slug = path.split('/').filter(Boolean).pop();

      const res = await fetch('/videos.json');
      const videos = await res.json();

      const video = videos.find(v => v.slug === slug);

      const page = document.getElementById('video-page');

      if (!video) {
        page.innerHTML = '<div class="empty">Video no encontrado.</div>';
        return;
      }

      page.innerHTML = `
        <h1 class="section-title">${video.titulo}</h1>

        <p class="video-desc" style="max-width:720px;margin-bottom:24px">
          ${video.descripcion || ''}
        </p>

        <div style="position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08)">
          <iframe
            src="${video.onedrive}"
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      `;
    }

    loadVideo();
  </script>
</body>
</html>
