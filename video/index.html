<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Studio Voreal</title> <link rel="stylesheet" href="../assets/css/style.css" /> </head> <body> <header> <div class="brand">Studio Voreal</div> </header> <main class="container" id="video-page"> <div class="empty">Cargando video…</div> </main> <script> async function loadVideo() { const params = new URLSearchParams(location.search); const slug = params.get("v"); const res = await fetch("../videos.json"); const videos = await res.json(); const video = videos.find(v => v.slug === slug); const page = document.getElementById("video-page"); if (!video) { page.innerHTML = '<div class="empty">Video no encontrado.</div>'; return; } page.innerHTML = ` <h1 class="section-title">${video.titulo}</h1> <p class="video-desc" style="max-width:720px;margin-bottom:24px">${video.descripcion || ""}</p> <a class="video-card" href="${video.onedrive}" target="_blank" style="display:inline-block;padding:18px 22px"> Ver video en OneDrive </a> `; } loadVideo(); </script> </body> </html>
